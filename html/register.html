<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>
    <meta name="viewport" content="width=device-width, inital-scale=1.0">

    <link rel="shortcut icon" href="midia/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../css/design-tokens.css" type="text/css">
    <link rel="stylesheet" href="css/login.css" type="text/css">
    <link rel="stylesheet" href="../css/register.css" type="text/css">

</head>
<body>
    <header>
      <div class="logo">
        <img src="../midia/logo (2).png" alt="logo" class="logo">
        <h1> espreitar.</h1>
      </div>

    </header>

    <main>
        <h1> Registrar-se</h1>
      <form class="registro">
        <p>Nome</p>
        <input type="text" id="nome" required>
        <p>E-mail</p>
        <input type="email" id="email" required>
        <p>Senha</p>
        <input type="password" placeholder="*******" id="senha" required>
        <p>Confirmar Senha</p>
        <input type="password"  id="confirmar-senha" required>
      </form>

     <div class="acoes">

         <input type="submit" value="Cancelar" class="cancelar">
         <input type="submit" value="Confirmar" class="enviar">

     </div>

    </main>

</body>
</html>
