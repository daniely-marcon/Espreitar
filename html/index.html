<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, inital-scale=1.0">
    <title>Espreitar</title>
    <link rel="shortcut icon" href="../midia/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="../css/design-tokens.css" type="text/css">
    <link rel="stylesheet" href="../css/style.css" type="text/css">

</head>
<body>
        <header class="cabecalho">
            <img src="../midia/logo (2).png"  alt="logo-espreitar">
            <h1 >espreitar.</h1>

            <div class="busca">
                <select class="categoria">
                    <option value="filme">Filme</option>
                    <option value="serie">Série</option>
                </select>

                <select class="classificacao">
                    <option value="ruim">Ruim</option>
                    <option value="razoável">Razoável</option>
                    <option value="bom">Bom</option>
                    <option value="muito_bom">Muito Bom</option>
                    <option value="excelente">Excelente</option>
                </select>
            </div>

                <form id="pesquisa" role="search">
                    <input type="text" placeholder="Buscar..." name="search">
                    <button type="submit"><i class="fa fa-search"></i></button>
                </form>

            <aside>
                    <button type="submit" class="login" id="login">Login</button>
                    <button type="submit" class="registrar" id="resgitrar">Registrar</button>

           </aside>
        </header>

    <main>
        <hr class="line">
        <h2 class="secao-titulo">Em Destaque</h2>

        <!-- Os cards são criados pelo script.js -->
        <section id="grid-filmes" class="grid-filmes"></section>

        <!-- Marcador invisível: quando ele aparece na tela, carregamos a próxima página -->
        <div id="sentinela" class="sentinela"></div>
        <p id="status" class="status" role="status"></p>
    </main>

        <script src="../js/script.js"></script>
    </main>
</body>
</html>
