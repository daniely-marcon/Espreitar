spring.application.name=espreitar
server.port=8081
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]

# ---------- Banco de dados (MySQL do Compose local, porta 3310) ----------
spring.datasource.url=jdbc:mysql://localhost:3310/espreitar?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&connectTimeout=20000
spring.datasource.username=${DB_USER:user_lbd}
spring.datasource.password=${DB_PASSWORD:123}

# ---------- JPA / Hibernate ----------
# O Flyway cria as tabelas; o Hibernate so confere se as entidades batem com elas
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- Flyway ----------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Use SOMENTE se as tabelas ja existirem no banco sem historico do Flyway
# (e igualarem o V1). Depois de rodar uma vez, pode apagar estas duas linhas.
# spring.flyway.baseline-on-migrate=true
# spring.flyway.baseline-version=1

# ---------- JWT ----------
# O segredo precisa ter pelo menos 32 caracteres. Nunca escreva o valor real aqui.
jwt.secret=${JWT_SECRET:12345678901234567890123456789012}
jwt.expiration=3600000
google.client-id=${GOOGLE_CLIENT_ID:}
tmdb.access-token=${TMDB_ACCESS_TOKEN:}
