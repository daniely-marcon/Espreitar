services:
  mysql:
    image: mysql:8.4
    container_name: espreitar-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: espreitar
      MYSQL_USER: ${DB_USER:-user_lbd}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no arquivo .env}
    ports:
      - "${MYSQL_PORT:-3310}:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_espreitar:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_espreitar:
